version: '3.8'

services:
  chitchatter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chitchatter
    restart: unless-stopped
    ports:
      - '3000:80'
    environment:
      # 如果需要使用哈希路由（适合静态文件服务器）
      # VITE_ROUTER_TYPE: hash
    labels:
      # 用于反向代理识别
      - 'com.chitchatter.description=Chitchatter P2P Chat Application'
      - 'com.chitchatter.port=3000'
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:80',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
